<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Segoe UI', sans-serif">
  <!-- Editor Background -->
  <rect width="600" height="400" fill="#1e1e1e" />
  
  <!-- Line Numbers -->
  <text x="20" y="40" fill="#858585" font-family="Consolas" font-size="14">1</text>
  <text x="20" y="65" fill="#858585" font-family="Consolas" font-size="14">2</text>
  
  <!-- Code Content -->
  <text x="50" y="40" font-family="Consolas" font-size="14">
    <tspan fill="#569cd6">SELECT</tspan> <tspan fill="#d4d4d4">*</tspan>
  </text>
  <text x="50" y="65" font-family="Consolas" font-size="14">
    <tspan fill="#569cd6">FROM</tspan> Sal|
  </text>
  
  <!-- Cursor -->
  <path d="M 120 53 L 120 69" stroke="#d4d4d4" stroke-width="2" />
  
  <!-- Completion Popup -->
  <g transform="translate(120, 73)">
    <rect width="250" height="180" fill="#252526" stroke="#454545" rx="3" />
    
    <!-- Item 1 (Selected - Schema/Table priority) -->
    <rect x="0" y="0" width="250" height="25" fill="#094771" />
    <text x="28" y="17" fill="#ffffff" font-size="12">Sales</text>
    <text x="180" y="17" fill="#858585" font-size="11">Schema</text>
    <rect x="10" y="5" width="14" height="14" fill="#ce9178" opacity="0.8" /> <!-- Schema Icon Color -->
    
    <!-- Item 2 -->
    <text x="28" y="42" fill="#cccccc" font-size="12">Sales.Customers</text>
    <text x="180" y="42" fill="#858585" font-size="11">Table</text>
    <rect x="10" y="30" width="14" height="14" fill="#ce9178" opacity="0.8" /> <!-- Table Icon Color -->

     <!-- Item 3 -->
    <text x="28" y="67" fill="#cccccc" font-size="12">Sales.Orders</text>
    <text x="180" y="67" fill="#858585" font-size="11">Table</text>
    <rect x="10" y="55" width="14" height="14" fill="#ce9178" opacity="0.8" />

    <!-- Item 4 (Lower Priority Column) -->
    <text x="28" y="92" fill="#cccccc" font-size="12">Salary</text>
    <text x="180" y="92" fill="#858585" font-size="11">Column</text>
    <rect x="10" y="80" width="14" height="14" fill="#007acc" opacity="0.8" /> <!-- Column Icon Color -->

     <!-- Scrollbar -->
    <rect x="242" y="5" width="4" height="80" fill="#424242" rx="2" />
  </g>
  
</svg>