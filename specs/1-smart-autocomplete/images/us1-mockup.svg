<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Segoe UI', sans-serif">
  <!-- Editor Background -->
  <rect width="600" height="400" fill="#1e1e1e" />
  
  <!-- Line Numbers -->
  <text x="20" y="40" fill="#858585" font-family="Consolas" font-size="14">1</text>
  <text x="20" y="65" fill="#858585" font-family="Consolas" font-size="14">2</text>
  
  <!-- Code Content -->
  <text x="50" y="40" font-family="Consolas" font-size="14">
    <tspan fill="#569cd6">SELECT</tspan> <tspan fill="#d4d4d4">c.</tspan>
  </text>
  <text x="50" y="65" font-family="Consolas" font-size="14">
    <tspan fill="#569cd6">FROM</tspan> <tspan fill="#4ec9b0">Sales.Customers</tspan> <tspan fill="#d4d4d4">c</tspan>
  </text>
  
  <!-- Cursor -->
  <path d="M 120 28 L 120 44" stroke="#d4d4d4" stroke-width="2" />
  
  <!-- Completion Popup -->
  <g transform="translate(120, 48)">
    <rect width="250" height="180" fill="#252526" stroke="#454545" rx="3" />
    
    <!-- Header/Active Item -->
    <rect x="0" y="5" width="250" height="25" fill="#094771" />
    
    <!-- Items -->
    <!-- Item 1 (Selected) -->
    <text x="28" y="22" fill="#ffffff" font-size="12">CustomerID</text>
    <text x="180" y="22" fill="#858585" font-size="11">Column</text>
    <rect x="10" y="10" width="14" height="14" fill="#007acc" opacity="0.8" /> <!-- Mock Icon -->
    
    <!-- Item 2 -->
    <text x="28" y="47" fill="#cccccc" font-size="12">CustomerName</text>
    <text x="180" y="47" fill="#858585" font-size="11">Column</text>
    <rect x="10" y="35" width="14" height="14" fill="#007acc" opacity="0.8" />

    <!-- Item 3 -->
    <text x="28" y="72" fill="#cccccc" font-size="12">CustomerCategory</text>
    <text x="180" y="72" fill="#858585" font-size="11">Column</text>
    <rect x="10" y="60" width="14" height="14" fill="#007acc" opacity="0.8" />

    <!-- Item 4 -->
    <text x="28" y="97" fill="#cccccc" font-size="12">PostalAddress</text>
    <text x="180" y="97" fill="#858585" font-size="11">Column</text>
    <rect x="10" y="85" width="14" height="14" fill="#007acc" opacity="0.8" />

    <!-- Scrollbar -->
    <rect x="242" y="5" width="4" height="80" fill="#424242" rx="2" />
  </g>
  
  <!-- Tooltip/Details -->
  <g transform="translate(375, 48)">
    <rect width="200" height="80" fill="#252526" stroke="#454545" rx="3" />
    <text x="10" y="20" fill="#569cd6" font-size="12" font-weight="bold">CustomerID</text>
    <text x="10" y="40" fill="#d4d4d4" font-size="12">(int, PK)</text>
    <text x="10" y="60" fill="#858585" font-size="11">Sales.Customers</text>
  </g>
</svg>